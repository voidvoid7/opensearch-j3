# Local OpenSearch logging stack:
#   go-app (slog JSON -> stdout) --fluentd log driver (dockerd)--> fluent-bit:24224 --> opensearch <-- dashboards
# Security plugin is disabled: plain HTTP, no auth. Local testing only.

services:
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - os-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0   # keep equal to the engine version
    container_name: opensearch-dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: fluent-bit
    volumes:
      - ./fake-app/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    ports:
      - "24224:24224"   # dockerd connects from the HOST, so this must be published
    depends_on:
      opensearch:
        condition: service_healthy

  go-app:
    build: ./fake-app
    container_name: go-app
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224   # resolved by dockerd on the host, not inside the container
        fluentd-async: "true"              # start even if fluent-bit isn't up yet; buffer in dockerd
        fluentd-sub-second-precision: "true"
        tag: app.go-app
    depends_on:
      - fluent-bit

volumes:
  os-data: