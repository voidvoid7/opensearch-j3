[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf

# Receives from Docker's fluentd log driver.
# Record: { log, container_id, container_name, source }
[INPUT]
    Name    forward
    Listen  0.0.0.0
    Port    24224

# slog JSON is in "log" -> expand into fields (time, level, msg, service, request_id, ...)
[FILTER]
    Name          parser
    Match         app.*
    Key_Name      log
    Parser        json
    Reserve_Data  On

[OUTPUT]
    Name                opensearch
    Match               app.*
    Host                opensearch
    Port                9200
    tls                 Off
    # Daily indices: app-logs-YYYY.MM.DD
    Logstash_Format     On
    Logstash_Prefix     app-logs
    # Required for OpenSearch 2.x/3.x (mapping types removed)
    Suppress_Type_Name  On
    Replace_Dots        On
    Trace_Error         On